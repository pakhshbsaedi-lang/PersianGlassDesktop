name: Build PersianGlass Desktop
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish x64
        run: dotnet publish PersianGlassDesktop/PersianGlassDesktop.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: PersianGlassDesktop-V2-win-x64
          path: PersianGlassDesktop/bin/Release/net8.0-windows/win-x64/publish/
